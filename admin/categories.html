<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/favicon.svg?v=3">
  <title>پنل مدیریت | دسته‌بندی‌ها</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 class="mb-3">مدیریت دسته‌بندی‌ها</h4>
          <form class="row g-2 mb-3" onsubmit="addCat(event)">
            <div class="col-md-8">
              <input type="text" id="catName" class="form-control" placeholder="نام دسته‌بندی جدید" required>
            </div>
            <div class="col-md-4">
              <button class="btn btn-main w-100" type="submit">افزودن</button>
            </div>
          </form>
          <table class="table table-bordered">
            <thead>
              <tr><th>نام</th><th>عملیات</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    requireAdmin();
    renderAdminSidebar("categories");
    showCats();

    function showCats() {
      var cats = getData("categories") || [];
      var html = "";
      for (var i = 0; i < cats.length; i++) {
        html += "<tr><td>" + cats[i].name + "</td>";
        html += '<td><button class="btn btn-sm btn-danger" onclick="deleteCat(' + cats[i].id + ')">حذف</button></td></tr>';
      }
      document.getElementById("tableBody").innerHTML = html || '<tr><td colspan="2">موردی نیست</td></tr>';
    }

    function addCat(e) {
      e.preventDefault();
      var name = document.getElementById("catName").value.trim();
      var cats = getData("categories") || [];
      cats.push({ id: getNextId("category"), name: name });
      setData("categories", cats);
      document.getElementById("catName").value = "";
      showCats();
    }

    function deleteCat(id) {
      if (!confirm("حذف شود؟")) return;
      var cats = getData("categories") || [];
      var newCats = [];
      for (var i = 0; i < cats.length; i++) {
        if (cats[i].id != id) newCats.push(cats[i]);
      }
      setData("categories", newCats);
      showCats();
    }
  </script>
</body>
</html>
