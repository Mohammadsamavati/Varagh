<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/favicon.svg?v=3">
  <title>مدیریت ورق | داشبورد</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 class="mb-2">داشبورد مدیریت ورق</h4>
          <p class="text-muted mb-0">خلاصه وضعیت فروشگاه، موجودی و درخواست‌های در جریان</p>
        </div>
        <div class="row" id="stats"></div>
        <div class="panel-box">
          <h5 class="mb-3">کارهای پرتکرار</h5>
          <div class="action-row">
            <a href="books.html" class="btn btn-main">مدیریت کتاب‌ها</a>
            <a href="requests.html" class="btn btn-outline-ink">بررسی درخواست‌ها</a>
            <a href="donations.html" class="btn btn-outline-ink">اهدای کتاب</a>
            <a href="reports.html" class="btn btn-outline-ink">مشاهده گزارش‌ها</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    requireAdmin();
    renderAdminSidebar("dashboard");

    var books = getData("books") || [];
    var users = getData("users") || [];
    var requests = getData("requests") || [];
    var donations = getData("donations") || [];
    var orders = getData("orders") || [];

    var pendingReq = 0;
    for (var i = 0; i < requests.length; i++) {
      if (requests[i].status === "pending") pendingReq++;
    }
    var pendingDon = 0;
    for (var i = 0; i < donations.length; i++) {
      if (donations[i].status === "pending") pendingDon++;
    }

    var userCount = 0;
    for (var i = 0; i < users.length; i++) {
      if (users[i].role === "user") userCount++;
    }

    document.getElementById("stats").innerHTML =
      '<div class="col-md-4 col-6"><div class="stat-box"><h3>' + books.length + '</h3><p>عنوان کتاب</p></div></div>' +
      '<div class="col-md-4 col-6"><div class="stat-box"><h3>' + userCount + '</h3><p>کاربر فعال</p></div></div>' +
      '<div class="col-md-4 col-6"><div class="stat-box"><h3>' + pendingReq + '</h3><p>درخواست در انتظار</p></div></div>' +
      '<div class="col-md-4 col-6"><div class="stat-box"><h3>' + pendingDon + '</h3><p>اهدای در انتظار</p></div></div>' +
      '<div class="col-md-4 col-6"><div class="stat-box"><h3>' + orders.length + '</h3><p>سفارش فروش</p></div></div>' +
      '<div class="col-md-4 col-6"><div class="stat-box"><h3>' + requests.length + '</h3><p>کل درخواست‌ها</p></div></div>';
  </script>
</body>
</html>
