<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/logo.jpg">
  <title>پنل مدیریت | تحویل و بازگشت</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 class="mb-3">مدیریت تحویل و بازگشت کتاب‌ها</h4>
          <p class="text-muted">درخواست‌های تایید شده را می‌توانید تحویل دهید یا بازگشت ثبت کنید.</p>
          <div class="table-responsive">
            <table class="table table-bordered table-sm">
              <thead>
                <tr>
                  <th>کد</th>
                  <th>کاربر</th>
                  <th>کتاب</th>
                  <th>مهلت</th>
                  <th>وضعیت</th>
                  <th>عملیات</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    requireAdmin();
    renderAdminSidebar("deliveries");
    showList();

    function showList() {
      var requests = getData("requests") || [];
      var html = "";
      for (var i = requests.length - 1; i >= 0; i--) {
        var r = requests[i];
        if (r.status !== "approved" && r.status !== "delivered" && r.status !== "overdue") continue;

        var u = getUserById(r.userId);
        var b = getBookById(r.bookId);

        // اگر از مهلت گذشته و هنوز برگشت نخورده، وضعیت دیرکرد
        if ((r.status === "approved" || r.status === "delivered") && r.dueDate) {
          if (daysBetween(r.dueDate, todayStr()) > 0) {
            r.status = "overdue";
          }
        }

        html += "<tr>";
        html += "<td>" + r.id + "</td>";
        html += "<td>" + (u ? u.name : "-") + "</td>";
        html += "<td>" + (b ? b.title : "-") + "</td>";
        html += "<td>" + (r.dueDate || "-") + "</td>";
        html += '<td><span class="' + statusClass(r.status) + '">' + statusText(r.status) + "</span></td>";
        html += "<td>";
        if (r.status === "approved") {
          html += '<button class="btn btn-sm btn-primary me-1" onclick="deliver(' + r.id + ')">ثبت تحویل</button>';
        }
        if (r.status === "delivered" || r.status === "overdue" || r.status === "approved") {
          html += '<button class="btn btn-sm btn-success" onclick="returnBook(' + r.id + ')">ثبت بازگشت</button>';
        }
        html += "</td></tr>";
      }

      // ذخیره وضعیت دیرکردها
      setData("requests", requests);
      document.getElementById("tableBody").innerHTML = html || '<tr><td colspan="6">موردی برای نمایش نیست</td></tr>';
    }

    function deliver(id) {
      var requests = getData("requests") || [];
      for (var i = 0; i < requests.length; i++) {
        if (requests[i].id == id) {
          requests[i].status = "delivered";
          requests[i].deliverDate = todayStr();
        }
      }
      setData("requests", requests);
      showList();
    }

    function returnBook(id) {
      var requests = getData("requests") || [];
      var books = getData("books") || [];
      var fines = getData("fines") || [];

      for (var i = 0; i < requests.length; i++) {
        if (requests[i].id == id) {
          var r = requests[i];
          var late = 0;
          if (r.dueDate) {
            late = daysBetween(r.dueDate, todayStr());
            if (late < 0) late = 0;
          }

          // برگشت موجودی
          for (var j = 0; j < books.length; j++) {
            if (books[j].id == r.bookId) {
              books[j].stock = books[j].stock + 1;
            }
          }

          if (late > 0) {
            var amount = late * FINE_PER_DAY;
            fines.push({
              id: getNextId("fine"),
              userId: r.userId,
              bookId: r.bookId,
              requestId: r.id,
              amount: amount,
              daysLate: late,
              note: "جریمه دیرکرد " + late + " روز",
              paid: false,
              date: todayStr()
            });
            alert("کتاب برگشت داده شد. جریمه دیرکرد: " + formatPrice(amount));
          } else {
            alert("کتاب بدون جریمه برگشت داده شد");
          }

          requests[i].status = "returned";
          requests[i].returnDate = todayStr();
        }
      }

      setData("requests", requests);
      setData("books", books);
      setData("fines", fines);
      showList();
    }
  </script>
</body>
</html>
