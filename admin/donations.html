<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/favicon.svg?v=3">
  <title>پنل مدیریت | اهدای کتاب</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 class="mb-3">مدیریت درخواست‌های اهدای کتاب</h4>
          <div class="table-responsive">
            <table class="table table-bordered table-sm">
              <thead>
                <tr>
                  <th>کد</th>
                  <th>کاربر</th>
                  <th>عنوان</th>
                  <th>نویسنده</th>
                  <th>وضعیت</th>
                  <th>عملیات</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    requireAdmin();
    renderAdminSidebar("donations");
    showDonations();

    function showDonations() {
      var donations = getData("donations") || [];
      var html = "";
      for (var i = donations.length - 1; i >= 0; i--) {
        var d = donations[i];
        var u = getUserById(d.userId);
        html += "<tr>";
        html += "<td>" + d.id + "</td>";
        html += "<td>" + (u ? u.name : "-") + "</td>";
        html += "<td>" + d.title + "</td>";
        html += "<td>" + d.author + "</td>";
        html += '<td><span class="' + statusClass(d.status) + '">' + statusText(d.status) + "</span></td>";
        html += "<td>";
        if (d.status === "pending") {
          html += '<button class="btn btn-sm btn-success me-1" onclick="approveDon(' + d.id + ')">تایید</button>';
          html += '<button class="btn btn-sm btn-danger" onclick="rejectDon(' + d.id + ')">رد</button>';
        } else if (d.status === "approved") {
          html += '<button class="btn btn-sm btn-primary" onclick="receiveDon(' + d.id + ')">ثبت دریافت و افزودن به موجودی</button>';
        } else {
          html += "-";
        }
        html += "</td></tr>";
      }
      document.getElementById("tableBody").innerHTML = html || '<tr><td colspan="6">موردی نیست</td></tr>';
    }

    function approveDon(id) {
      var donations = getData("donations") || [];
      for (var i = 0; i < donations.length; i++) {
        if (donations[i].id == id) donations[i].status = "approved";
      }
      setData("donations", donations);
      showDonations();
    }

    function rejectDon(id) {
      if (!confirm("رد شود؟")) return;
      var donations = getData("donations") || [];
      for (var i = 0; i < donations.length; i++) {
        if (donations[i].id == id) donations[i].status = "rejected";
      }
      setData("donations", donations);
      showDonations();
    }

    // وقتی کتاب اهدایی دریافت شد به موجودی کتاب‌ها اضافه میشه
    function receiveDon(id) {
      var donations = getData("donations") || [];
      var books = getData("books") || [];
      var d = null;

      for (var i = 0; i < donations.length; i++) {
        if (donations[i].id == id) d = donations[i];
      }
      if (!d) return;

      // اگر کتاب هم‌نام وجود داشت موجودی‌ش زیاد بشه، وگرنه کتاب جدید
      var found = null;
      for (var i = 0; i < books.length; i++) {
        if (books[i].title === d.title && books[i].author === d.author) {
          found = books[i];
          books[i].stock = books[i].stock + 1;
        }
      }

      if (!found) {
        books.push({
          id: getNextId("book"),
          title: d.title,
          author: d.author,
          categoryId: d.categoryId || 1,
          price: 50000,
          rentPrice: 10000,
          stock: 1,
          forSale: true,
          forRent: true,
          forBorrow: true,
          description: "کتاب اهدایی - " + (d.note || ""),
          year: null,
          publisher: "اهدایی"
        });
      }

      for (var i = 0; i < donations.length; i++) {
        if (donations[i].id == id) {
          donations[i].status = "received";
          donations[i].receivedDate = todayStr();
        }
      }

      setData("books", books);
      setData("donations", donations);
      alert("کتاب دریافت و به موجودی اضافه شد");
      showDonations();
    }
  </script>
</body>
</html>
