<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/favicon.svg?v=3">
  <title>پنل مدیریت | جریمه‌ها</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 class="mb-3">مدیریت جریمه دیرکرد</h4>
          <p>مبلغ جریمه روزانه: <strong id="fineRate"></strong></p>
          <div class="table-responsive">
            <table class="table table-bordered">
              <thead>
                <tr>
                  <th>کاربر</th>
                  <th>کتاب</th>
                  <th>روز دیرکرد</th>
                  <th>مبلغ</th>
                  <th>وضعیت</th>
                  <th>عملیات</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    requireAdmin();
    renderAdminSidebar("fines");
    document.getElementById("fineRate").textContent = formatPrice(FINE_PER_DAY);
    showFines();

    function showFines() {
      var fines = getData("fines") || [];
      var html = "";
      for (var i = fines.length - 1; i >= 0; i--) {
        var f = fines[i];
        var u = getUserById(f.userId);
        var b = getBookById(f.bookId);
        html += "<tr>";
        html += "<td>" + (u ? u.name : "-") + "</td>";
        html += "<td>" + (b ? b.title : "-") + "</td>";
        html += "<td>" + (f.daysLate || "-") + "</td>";
        html += "<td>" + formatPrice(f.amount) + "</td>";
        html += "<td>" + (f.paid ? "پرداخت شده" : "پرداخت نشده") + "</td>";
        html += "<td>";
        if (!f.paid) {
          html += '<button class="btn btn-sm btn-success" onclick="markPaid(' + f.id + ')">علامت پرداخت</button>';
        } else {
          html += "-";
        }
        html += "</td></tr>";
      }
      document.getElementById("tableBody").innerHTML = html || '<tr><td colspan="6">جریمه‌ای ثبت نشده</td></tr>';
    }

    function markPaid(id) {
      var fines = getData("fines") || [];
      for (var i = 0; i < fines.length; i++) {
        if (fines[i].id == id) {
          fines[i].paid = true;
          fines[i].paidDate = todayStr();
        }
      }
      setData("fines", fines);
      showFines();
    }
  </script>
</body>
</html>
