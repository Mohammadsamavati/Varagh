<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/favicon.svg?v=3">
  <title>پنل مدیریت | سفارش‌ها</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 class="mb-3">سفارش‌های فروش</h4>
          <div class="table-responsive">
            <table class="table table-bordered">
              <thead>
                <tr>
                  <th>کد</th>
                  <th>کاربر</th>
                  <th>کتاب</th>
                  <th>مبلغ</th>
                  <th>تاریخ</th>
                  <th>وضعیت</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    requireAdmin();
    renderAdminSidebar("orders");

    var orders = getData("orders") || [];
    var html = "";
    for (var i = orders.length - 1; i >= 0; i--) {
      var o = orders[i];
      var u = getUserById(o.userId);
      var b = getBookById(o.bookId);
      html += "<tr>";
      html += "<td>" + o.id + "</td>";
      html += "<td>" + (u ? u.name : "-") + "</td>";
      html += "<td>" + (b ? b.title : "-") + "</td>";
      html += "<td>" + formatPrice(o.amount) + "</td>";
      html += "<td>" + o.date + "</td>";
      html += '<td><span class="' + statusClass(o.status) + '">' + statusText(o.status) + "</span></td>";
      html += "</tr>";
    }
    document.getElementById("tableBody").innerHTML = html || '<tr><td colspan="6">سفارشی ثبت نشده</td></tr>';
  </script>
</body>
</html>
