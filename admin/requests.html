<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/favicon.svg?v=3">
  <title>پنل مدیریت | درخواست‌ها</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 class="mb-3">مدیریت درخواست‌های امانت و اجاره</h4>
          <div class="table-responsive">
            <table class="table table-bordered table-sm">
              <thead>
                <tr>
                  <th>کد</th>
                  <th>کاربر</th>
                  <th>کتاب</th>
                  <th>نوع</th>
                  <th>وضعیت</th>
                  <th>عملیات</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>

        <div class="panel-box" id="approveBox" style="display:none;">
          <h5>تایید درخواست</h5>
          <input type="hidden" id="reqId">
          <div class="mb-2">
            <label class="form-label">مدت زمان (روز)</label>
            <input type="number" id="days" class="form-control" min="1" value="7">
          </div>
          <button class="btn btn-success" onclick="confirmApprove()">تایید نهایی</button>
          <button class="btn btn-secondary" onclick="document.getElementById('approveBox').style.display='none'">لغو</button>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    requireAdmin();
    renderAdminSidebar("requests");
    showRequests();

    function showRequests() {
      var requests = getData("requests") || [];
      var html = "";
      for (var i = requests.length - 1; i >= 0; i--) {
        var r = requests[i];
        var u = getUserById(r.userId);
        var b = getBookById(r.bookId);
        html += "<tr>";
        html += "<td>" + r.id + "</td>";
        html += "<td>" + (u ? u.name : "-") + "</td>";
        html += "<td>" + (b ? b.title : "-") + "</td>";
        html += "<td>" + (r.type === "borrow" ? "امانت" : "اجاره") + "</td>";
        html += '<td><span class="' + statusClass(r.status) + '">' + statusText(r.status) + "</span></td>";
        html += "<td>";
        if (r.status === "pending") {
          html += '<button class="btn btn-sm btn-success me-1" onclick="openApprove(' + r.id + ')">تایید</button>';
          html += '<button class="btn btn-sm btn-danger" onclick="rejectReq(' + r.id + ')">رد</button>';
        } else {
          html += "-";
        }
        html += "</td></tr>";
      }
      document.getElementById("tableBody").innerHTML = html || '<tr><td colspan="6">درخواستی نیست</td></tr>';
    }

    function openApprove(id) {
      var requests = getData("requests") || [];
      var r = null;
      for (var i = 0; i < requests.length; i++) {
        if (requests[i].id == id) r = requests[i];
      }
      document.getElementById("reqId").value = id;
      document.getElementById("days").value = r && r.days ? r.days : 7;
      document.getElementById("approveBox").style.display = "block";
    }

    function confirmApprove() {
      var id = Number(document.getElementById("reqId").value);
      var days = Number(document.getElementById("days").value);
      if (!days || days < 1) {
        alert("مدت را درست وارد کنید");
        return;
      }

      var requests = getData("requests") || [];
      var books = getData("books") || [];

      for (var i = 0; i < requests.length; i++) {
        if (requests[i].id == id) {
          var book = null;
          for (var j = 0; j < books.length; j++) {
            if (books[j].id == requests[i].bookId) book = books[j];
          }
          if (!book || book.stock <= 0) {
            alert("موجودی کتاب کافی نیست");
            return;
          }

          // کم کردن موجودی موقع تایید
          for (var j = 0; j < books.length; j++) {
            if (books[j].id == requests[i].bookId) {
              books[j].stock = books[j].stock - 1;
            }
          }

          requests[i].status = "approved";
          requests[i].days = days;
          requests[i].dueDate = addDays(todayStr(), days);
          if (requests[i].type === "rent" && book) {
            requests[i].amount = book.rentPrice * days;
          }
        }
      }

      setData("books", books);
      setData("requests", requests);
      document.getElementById("approveBox").style.display = "none";
      showRequests();
      alert("درخواست تایید شد");
    }

    function rejectReq(id) {
      if (!confirm("درخواست رد شود؟")) return;
      var requests = getData("requests") || [];
      for (var i = 0; i < requests.length; i++) {
        if (requests[i].id == id) {
          requests[i].status = "rejected";
        }
      }
      setData("requests", requests);
      showRequests();
    }
  </script>
</body>
</html>
