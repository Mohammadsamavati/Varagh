<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/favicon.svg?v=3">
  <title>پنل مدیریت | کاربران</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 class="mb-3">مدیریت کاربران</h4>
          <div class="table-responsive">
            <table class="table table-bordered table-striped">
              <thead>
                <tr>
                  <th>نام</th>
                  <th>ایمیل</th>
                  <th>تلفن</th>
                  <th>نقش</th>
                  <th>عملیات</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    requireAdmin();
    renderAdminSidebar("users");
    showUsers();

    function showUsers() {
      var users = getData("users") || [];
      var html = "";
      for (var i = 0; i < users.length; i++) {
        var u = users[i];
        html += "<tr>";
        html += "<td>" + u.name + "</td>";
        html += "<td>" + u.email + "</td>";
        html += "<td>" + (u.phone || "-") + "</td>";
        html += "<td>" + (u.role === "admin" ? "مدیر" : "کاربر") + "</td>";
        html += "<td>";
        if (u.role !== "admin") {
          html += '<button class="btn btn-sm btn-danger" onclick="deleteUser(' + u.id + ')">حذف</button>';
        } else {
          html += "-";
        }
        html += "</td></tr>";
      }
      document.getElementById("tableBody").innerHTML = html;
    }

    function deleteUser(id) {
      if (!confirm("کاربر حذف شود؟")) return;
      var users = getData("users") || [];
      var newUsers = [];
      for (var i = 0; i < users.length; i++) {
        if (users[i].id != id) newUsers.push(users[i]);
      }
      setData("users", newUsers);
      showUsers();
    }
  </script>
</body>
</html>
