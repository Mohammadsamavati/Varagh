<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="images/favicon.svg?v=3">
  <title>ورق | جزئیات کتاب</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div id="bookDetail"></div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    var id = getQueryParam("id");
    var book = getBookById(id);
    var box = document.getElementById("bookDetail");

    if (!book) {
      box.innerHTML = '<div class="panel-box">کتاب پیدا نشد.</div>';
    } else {
      var stockBadge = book.stock > 0
        ? '<span class="badge-soft badge-available">موجود در انبار</span>'
        : '<span class="badge-soft badge-unavailable">ناموجود</span>';

      var html = '<div class="panel-box">';
      html += '<div class="detail-layout">';
      html += '<div class="detail-cover-box">' + bookCoverHtml(book, true) + "</div>";
      html += '<div class="detail-info">';
      html += "<h1>" + book.title + "</h1>";
      html += stockBadge;
      html += '<ul class="info-list mt-3">';
      html += "<li><strong>نویسنده</strong> " + book.author + "</li>";
      html += "<li><strong>دسته‌بندی</strong> " + getCategoryName(book.categoryId) + "</li>";
      html += "<li><strong>ناشر</strong> " + (book.publisher || "-") + "</li>";
      html += "<li><strong>سال نشر</strong> " + (book.year || "-") + "</li>";
      html += "<li><strong>قیمت فروش</strong> " + formatPrice(book.price) + "</li>";
      html += "<li><strong>اجاره روزانه</strong> " + formatPrice(book.rentPrice) + "</li>";
      html += "<li><strong>موجودی</strong> " + book.stock + " نسخه</li>";
      html += "</ul>";
      html += "<p>" + book.description + "</p>";
      html += '<div class="action-row">';

      if (book.forSale && book.stock > 0) {
        html += '<button class="btn btn-main" onclick="buyBook(' + book.id + ')">خرید کتاب</button>';
      }
      if (book.forBorrow && book.stock > 0) {
        html += '<a class="btn btn-outline-ink" href="user/borrow.html?bookId=' + book.id + '">درخواست امانت</a>';
      }
      if (book.forRent && book.stock > 0) {
        html += '<a class="btn btn-outline-ink" href="user/rent.html?bookId=' + book.id + '">درخواست اجاره</a>';
      }
      html += '<button class="btn btn-outline-ink" onclick="addWishlist(' + book.id + ')">افزودن به علاقه‌مندی</button>';
      html += "</div></div></div></div>";
      box.innerHTML = html;
    }

    function buyBook(bookId) {
      var user = getCurrentUser();
      if (!user) {
        alert("برای خرید باید وارد حساب کاربری شوید");
        window.location.href = "login.html";
        return;
      }
      if (user.role === "admin") {
        alert("حساب مدیر امکان خرید ندارد");
        return;
      }
      window.location.href = "payment.html?bookId=" + bookId + "&type=sale";
    }

    function addWishlist(bookId) {
      var user = getCurrentUser();
      if (!user) {
        alert("ابتدا وارد شوید");
        window.location.href = "login.html";
        return;
      }

      var list = getData("wishlist") || [];
      for (var i = 0; i < list.length; i++) {
        if (list[i].userId === user.id && list[i].bookId == bookId) {
          alert("این کتاب قبلا به علاقه‌مندی‌ها اضافه شده است");
          return;
        }
      }

      list.push({ userId: user.id, bookId: Number(bookId) });
      setData("wishlist", list);
      alert("به لیست علاقه‌مندی‌ها اضافه شد");
    }
  </script>
</body>
</html>
