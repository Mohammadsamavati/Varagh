<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="images/logo.jpg">
  <title>ورق | فروشگاه کتاب</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <div class="page-hero">
      <h1>فروشگاه کتاب</h1>
      <p>جستجو کن، فیلتر بزن و کتاب مورد نظرت را پیدا کن.</p>
    </div>

    <div class="filter-bar">
      <div class="row g-2">
        <div class="col-md-4">
          <input type="text" id="searchInput" class="form-control" placeholder="جستجو بر اساس عنوان یا نویسنده...">
        </div>
        <div class="col-md-3">
          <select id="categoryFilter" class="form-select">
            <option value="">همه دسته‌ها</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="typeFilter" class="form-select">
            <option value="">همه انواع دسترسی</option>
            <option value="sale">قابل خرید</option>
            <option value="rent">قابل اجاره</option>
            <option value="borrow">قابل امانت</option>
          </select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-main w-100" onclick="filterBooks()">اعمال فیلتر</button>
        </div>
      </div>
    </div>

    <div class="row" id="booksList"></div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    var cats = getData("categories") || [];
    var catSelect = document.getElementById("categoryFilter");
    for (var i = 0; i < cats.length; i++) {
      var opt = document.createElement("option");
      opt.value = cats[i].id;
      opt.textContent = cats[i].name;
      catSelect.appendChild(opt);
    }

    var catParam = getQueryParam("category");
    if (catParam) catSelect.value = catParam;

    function showBooks(list) {
      var box = document.getElementById("booksList");
      if (list.length === 0) {
        box.innerHTML = '<div class="col-12"><div class="panel-box">کتابی با این مشخصات پیدا نشد.</div></div>';
        return;
      }
      var html = "";
      for (var i = 0; i < list.length; i++) {
        html += bookCardHtml(list[i], "");
      }
      box.innerHTML = html;
    }

    function filterBooks() {
      var q = document.getElementById("searchInput").value.trim().toLowerCase();
      var cat = document.getElementById("categoryFilter").value;
      var type = document.getElementById("typeFilter").value;
      var books = getData("books") || [];
      var result = [];

      for (var i = 0; i < books.length; i++) {
        var b = books[i];
        var ok = true;
        if (q) {
          var text = (b.title + " " + b.author).toLowerCase();
          if (text.indexOf(q) === -1) ok = false;
        }
        if (cat && b.categoryId != cat) ok = false;
        if (type === "sale" && !b.forSale) ok = false;
        if (type === "rent" && !b.forRent) ok = false;
        if (type === "borrow" && !b.forBorrow) ok = false;
        if (ok) result.push(b);
      }
      showBooks(result);
    }

    filterBooks();
  </script>
</body>
</html>
