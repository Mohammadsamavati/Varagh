<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="images/favicon.svg?v=3">
  <title>ورق | دسته‌بندی کتاب‌ها</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <div class="page-hero">
      <h1>دسته‌بندی کتاب‌ها</h1>
      <p>از بین موضوع‌ها انتخاب کن و مستقیم برو سراغ قفسه‌ای که می‌خواهی.</p>
    </div>
    <div class="row g-3 mb-5" id="catList"></div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    var cats = getData("categories") || [];
    var books = getData("books") || [];
    var html = "";

    for (var i = 0; i < cats.length; i++) {
      var count = 0;
      for (var j = 0; j < books.length; j++) {
        if (books[j].categoryId == cats[i].id) count++;
      }

      html += '<div class="col-md-4 col-sm-6">';
      html += '<div class="category-tile">';
      html += "<h5>" + cats[i].name + "</h5>";
      html += "<p>" + count + " عنوان در این دسته</p>";
      html += '<a href="books.html?category=' + cats[i].id + '" class="btn btn-sm btn-main">مشاهده کتاب‌ها</a>';
      html += "</div></div>";
    }

    document.getElementById("catList").innerHTML = html || "<p>دسته‌بندی‌ای ثبت نشده است.</p>";
  </script>
</body>
</html>
