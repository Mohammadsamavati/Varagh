<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="images/favicon.svg?v=3">
  <title>ورق | تماس با ما</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <div class="page-hero">
      <h1>تماس با ورق</h1>
      <p>سوال، پیشنهاد یا پیگیری سفارش؟ پیام بگذار تا بررسی کنیم.</p>
    </div>

    <div class="row g-4 mb-5">
      <div class="col-md-5">
        <div class="panel-box h-100">
          <h4 class="mb-3">اطلاعات ارتباطی</h4>
          <p><strong>آدرس:</strong> تهران، خیابان انقلاب، پلاک ۱۲</p>
          <p><strong>تلفن:</strong> ۰۲۱-۱۲۳۴۵۶۷۸</p>
          <p><strong>ایمیل:</strong> info@varagh.ir</p>
          <p><strong>ساعات پاسخگویی:</strong> شنبه تا چهارشنبه، ۹ تا ۱۷</p>
          <div class="contact-map-note mt-4">
            پشتیبانی ورق معمولا تا یک روز کاری پاسخ می‌دهد.
          </div>
        </div>
      </div>
      <div class="col-md-7">
        <div class="panel-box">
          <h4 class="mb-3">فرم پیام</h4>
          <form onsubmit="sendMessage(event)">
            <div class="mb-3">
              <label class="form-label">نام</label>
              <input type="text" id="cName" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">ایمیل</label>
              <input type="email" id="cEmail" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">پیام</label>
              <textarea id="cMessage" class="form-control" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-main">ارسال پیام</button>
          </form>
          <div id="contactMsg" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    function sendMessage(e) {
      e.preventDefault();
      document.getElementById("contactMsg").innerHTML =
        '<div class="alert alert-success">پیام شما دریافت شد. ممنون از همراهی‌تان.</div>';
      document.getElementById("cName").value = "";
      document.getElementById("cEmail").value = "";
      document.getElementById("cMessage").value = "";
    }
  </script>
</body>
</html>
