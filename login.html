<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="images/favicon.svg?v=3">
  <title>ورق | ورود</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="login-page">
    <div class="container">
      <div class="login-layout">
        <aside class="login-showcase">
          <a href="index.html" class="login-logo-wrap" aria-label="بازگشت به صفحه اصلی">
            <img src="images/logo.svg" alt="ورق" class="login-logo">
          </a>
          <div class="login-art" aria-hidden="true">
            <span class="login-art-book book-one"></span>
            <span class="login-art-book book-two"></span>
            <span class="login-art-book book-three"></span>
          </div>
          <div class="login-showcase-copy">
            <span class="login-eyebrow">جایی برای دوست‌داران کتاب</span>
            <h1>صفحه‌ی بعدی<br>از همین‌جا شروع می‌شود.</h1>
            <p>وارد دنیای ورق شو؛ کتابی برای خواندن پیدا کن، کتابی را به اشتراک بگذار و مسیرت را ادامه بده.</p>
          </div>
          <div class="login-showcase-foot"><span class="login-sparkle" aria-hidden="true">✦</span><span>هر ورق، یک شروع تازه</span></div>
        </aside>
        <div class="form-box login-form-panel">
      <h4 class="mb-1 text-center">ورود به ورق</h4>
      <p class="text-center text-muted mb-4">به حساب کاربری‌ات وارد شو</p>
      <form onsubmit="doLogin(event)">
        <div class="mb-3">
          <label class="form-label" for="email">ایمیل</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">رمز عبور</label>
          <input type="password" id="password" class="form-control" placeholder="رمز عبورت را وارد کن" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-main w-100">ورود</button>
      </form>
      <p class="mt-3 text-center mb-0">
        حساب نداری؟ <a href="register.html">عضویت در ورق</a>
      </p>
      <div id="loginError" class="mt-2"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    function doLogin(e) {
      e.preventDefault();
      var result = login(
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );

      if (!result.ok) {
        document.getElementById("loginError").innerHTML =
          '<div class="alert alert-danger">' + result.message + "</div>";
        return;
      }

      if (result.user.role === "admin") {
        window.location.href = "admin/dashboard.html";
      } else {
        window.location.href = "user/dashboard.html";
      }
    }
  </script>
</body>
</html>
