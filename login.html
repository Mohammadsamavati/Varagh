<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="images/favicon.svg?v=3">
  <title>ورق | ورود</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <div class="form-box">
      <h4 class="mb-1 text-center">ورود به ورق</h4>
      <p class="text-center text-muted mb-4">به حساب کاربری‌ات وارد شو</p>
      <form onsubmit="doLogin(event)">
        <div class="mb-3">
          <label class="form-label">ایمیل</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">رمز عبور</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-main w-100">ورود</button>
      </form>
      <p class="mt-3 text-center mb-0">
        حساب نداری؟ <a href="register.html">عضویت در ورق</a>
      </p>
      <div class="alert alert-sample mt-3">
        برای تست:<br>
        مدیر: admin@varagh.ir / admin123<br>
        کاربر: ali@gmail.com / 123456
      </div>
      <div id="loginError" class="mt-2"></div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    function doLogin(e) {
      e.preventDefault();
      var result = login(
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );

      if (!result.ok) {
        document.getElementById("loginError").innerHTML =
          '<div class="alert alert-danger">' + result.message + "</div>";
        return;
      }

      if (result.user.role === "admin") {
        window.location.href = "admin/dashboard.html";
      } else {
        window.location.href = "user/dashboard.html";
      }
    }
  </script>
</body>
</html>
