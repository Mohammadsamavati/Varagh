<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="images/favicon.svg?v=3">
  <title>ورق | درگاه پرداخت</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <div class="payment-box" id="payBox">
      <div class="gate-logo">پ</div>
      <h4>پرداخت امن ورق</h4>
      <p class="text-muted">درگاه آزمایشی برای شبیه‌سازی خرید</p>
      <div id="payInfo"></div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    var user = requireLogin();
    var bookId = getQueryParam("bookId");
    var type = getQueryParam("type") || "sale";
    var fineId = getQueryParam("fineId");
    var box = document.getElementById("payInfo");

    if (type === "fine" && fineId) {
      var fines = getData("fines") || [];
      var fine = null;
      for (var i = 0; i < fines.length; i++) {
        if (fines[i].id == fineId) fine = fines[i];
      }

      if (!fine || fine.userId !== user.id) {
        box.innerHTML = '<div class="alert alert-danger">جریمه پیدا نشد.</div>';
      } else if (fine.paid) {
        box.innerHTML = '<div class="alert alert-success">این جریمه قبلا پرداخت شده است.</div>';
      } else {
        box.innerHTML =
          "<p>پرداخت جریمه دیرکرد</p>" +
          '<div class="amount">' + formatPrice(fine.amount) + "</div>" +
          '<button class="btn btn-main me-2" onclick="payFine(' + fine.id + ')">تایید و پرداخت</button>' +
          '<a href="user/history.html" class="btn btn-outline-ink">انصراف</a>';
      }
    } else {
      var book = getBookById(bookId);
      if (!book) {
        box.innerHTML = '<div class="alert alert-danger">کتاب پیدا نشد.</div>';
      } else if (book.stock <= 0) {
        box.innerHTML = '<div class="alert alert-warning">موجودی این کتاب تمام شده است.</div>';
      } else {
        box.innerHTML =
          "<p>خرید کتاب <strong>" + book.title + "</strong></p>" +
          "<p class='text-muted'>" + book.author + "</p>" +
          '<div class="amount">' + formatPrice(book.price) + "</div>" +
          '<button class="btn btn-main me-2" onclick="confirmPay()">تایید و پرداخت</button>' +
          '<a href="book-detail.html?id=' + book.id + '" class="btn btn-outline-ink">انصراف</a>';
      }
    }

    function confirmPay() {
      var book = getBookById(bookId);
      if (!book || book.stock <= 0) {
        alert("امکان پرداخت وجود ندارد");
        return;
      }

      var books = getData("books") || [];
      for (var i = 0; i < books.length; i++) {
        if (books[i].id == book.id) {
          books[i].stock = books[i].stock - 1;
        }
      }
      setData("books", books);

      var orders = getData("orders") || [];
      orders.push({
        id: getNextId("order"),
        userId: user.id,
        bookId: book.id,
        amount: book.price,
        status: "paid",
        date: todayStr()
      });
      setData("orders", orders);

      document.getElementById("payBox").innerHTML =
        '<div class="gate-logo">✓</div>' +
        '<h4 class="text-success">پرداخت با موفقیت انجام شد</h4>' +
        "<p>سفارش شما ثبت شد و کتاب به حساب‌تان اضافه گردید.</p>" +
        '<a href="user/my-books.html" class="btn btn-main mt-3">مشاهده کتاب‌های من</a>';
    }

    function payFine(id) {
      var fines = getData("fines") || [];
      for (var i = 0; i < fines.length; i++) {
        if (fines[i].id == id) {
          fines[i].paid = true;
          fines[i].paidDate = todayStr();
        }
      }
      setData("fines", fines);

      document.getElementById("payBox").innerHTML =
        '<div class="gate-logo">✓</div>' +
        '<h4 class="text-success">جریمه پرداخت شد</h4>' +
        '<a href="user/history.html" class="btn btn-main mt-3">بازگشت به تاریخچه</a>';
    }
  </script>
</body>
</html>
