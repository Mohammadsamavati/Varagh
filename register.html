<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="images/logo.jpg">
  <title>ورق | عضویت</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container">
    <div class="form-box">
      <h4 class="mb-1 text-center">عضویت در ورق</h4>
      <p class="text-center text-muted mb-4">ساخت حساب کاربری جدید</p>
      <form onsubmit="doRegister(event)">
        <div class="mb-3">
          <label class="form-label">نام و نام خانوادگی</label>
          <input type="text" id="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">ایمیل</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">شماره تماس</label>
          <input type="text" id="phone" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">آدرس</label>
          <input type="text" id="address" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">رمز عبور</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-main w-100">ثبت‌نام</button>
      </form>
      <p class="mt-3 text-center mb-0">
        قبلا عضو شده‌ای؟ <a href="login.html">ورود</a>
      </p>
      <div id="regError" class="mt-2"></div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    function doRegister(e) {
      e.preventDefault();
      var result = register(
        document.getElementById("name").value.trim(),
        document.getElementById("email").value.trim(),
        document.getElementById("password").value,
        document.getElementById("phone").value.trim(),
        document.getElementById("address").value.trim()
      );

      if (!result.ok) {
        document.getElementById("regError").innerHTML =
          '<div class="alert alert-danger">' + result.message + "</div>";
        return;
      }

      alert("عضویت با موفقیت انجام شد");
      window.location.href = "user/dashboard.html";
    }
  </script>
</body>
</html>
