<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="images/favicon.svg?v=3">
  <title>ورق | عضویت</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="login-page">
    <div class="container">
      <div class="login-layout register-layout">
        <aside class="login-showcase register-showcase">
          <a href="index.html" class="login-logo-wrap" aria-label="بازگشت به صفحه اصلی">
            <img src="images/logo.svg" alt="ورق" class="login-logo">
          </a>
          <div class="login-art" aria-hidden="true">
            <span class="login-art-book book-one"></span>
            <span class="login-art-book book-two"></span>
            <span class="login-art-book book-three"></span>
          </div>
          <div class="login-showcase-copy">
            <span class="login-eyebrow">به جمع کتاب‌دوست‌ها بپیوند</span>
            <h1>عضویت تو،<br>شروع یک داستان تازه.</h1>
            <p>حساب خودت را بساز و برای پیدا کردن کتاب‌های تازه و به اشتراک گذاشتن کتاب‌ها آماده شو.</p>
          </div>
          <div class="login-showcase-foot"><span class="login-sparkle" aria-hidden="true">✦</span><span>یک جامعه، هزاران قصه</span></div>
        </aside>
        <div class="form-box login-form-panel register-form-panel">
      <h4 class="mb-1 text-center">عضویت در ورق</h4>
      <p class="text-center text-muted mb-4">ساخت حساب کاربری جدید</p>
      <form onsubmit="doRegister(event)">
        <div class="mb-3">
          <label class="form-label" for="name">نام و نام خانوادگی</label>
          <input type="text" id="name" class="form-control" autocomplete="name" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">ایمیل</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="phone">شماره تماس</label>
          <input type="text" id="phone" class="form-control" autocomplete="tel">
        </div>
        <div class="mb-3">
          <label class="form-label" for="address">آدرس</label>
          <input type="text" id="address" class="form-control" autocomplete="street-address">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">رمز عبور</label>
          <input type="password" id="password" class="form-control" placeholder="حداقل ۴ نویسه" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-main w-100">ثبت‌نام</button>
      </form>
      <p class="mt-3 text-center mb-0">
        قبلا عضو شده‌ای؟ <a href="login.html">ورود</a>
      </p>
      <div id="regError" class="mt-2"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    function doRegister(e) {
      e.preventDefault();
      var result = register(
        document.getElementById("name").value.trim(),
        document.getElementById("email").value.trim(),
        document.getElementById("password").value,
        document.getElementById("phone").value.trim(),
        document.getElementById("address").value.trim()
      );

      if (!result.ok) {
        document.getElementById("regError").innerHTML =
          '<div class="alert alert-danger">' + result.message + "</div>";
        return;
      }

      alert("عضویت با موفقیت انجام شد");
      window.location.href = "user/dashboard.html";
    }
  </script>
</body>
</html>
