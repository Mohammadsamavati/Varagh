<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/logo.jpg">
  <title>حساب کاربری | ورق</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 id="welcome" class="mb-2"></h4>
          <p class="text-muted mb-0">از اینجا می‌توانی خریدها، درخواست‌ها و علاقه‌مندی‌هایت را مدیریت کنی.</p>
        </div>
        <div class="row" id="stats"></div>
        <div class="panel-box">
          <h5 class="mb-3">میانبرها</h5>
          <div class="action-row">
            <a href="../books.html" class="btn btn-main">برو به فروشگاه</a>
            <a href="borrow.html" class="btn btn-outline-ink">درخواست امانت</a>
            <a href="rent.html" class="btn btn-outline-ink">درخواست اجاره</a>
            <a href="donate.html" class="btn btn-outline-ink">اهدای کتاب</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    var user = requireLogin();
    if (user && user.role === "admin") {
      window.location.href = "../admin/dashboard.html";
    }

    renderUserSidebar("dashboard");
    document.getElementById("welcome").textContent = "سلام " + user.name;

    var requests = getData("requests") || [];
    var donations = getData("donations") || [];
    var wishlist = getData("wishlist") || [];
    var orders = getData("orders") || [];

    var myReq = 0, myDon = 0, myWish = 0, myOrders = 0;
    for (var i = 0; i < requests.length; i++) {
      if (requests[i].userId === user.id) myReq++;
    }
    for (var i = 0; i < donations.length; i++) {
      if (donations[i].userId === user.id) myDon++;
    }
    for (var i = 0; i < wishlist.length; i++) {
      if (wishlist[i].userId === user.id) myWish++;
    }
    for (var i = 0; i < orders.length; i++) {
      if (orders[i].userId === user.id) myOrders++;
    }

    document.getElementById("stats").innerHTML =
      '<div class="col-md-3 col-6"><div class="stat-box"><h3>' + myReq + '</h3><p>درخواست‌ها</p></div></div>' +
      '<div class="col-md-3 col-6"><div class="stat-box"><h3>' + myOrders + '</h3><p>خریدها</p></div></div>' +
      '<div class="col-md-3 col-6"><div class="stat-box"><h3>' + myWish + '</h3><p>علاقه‌مندی</p></div></div>' +
      '<div class="col-md-3 col-6"><div class="stat-box"><h3>' + myDon + '</h3><p>اهدای کتاب</p></div></div>';
  </script>
</body>
</html>
