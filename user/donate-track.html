<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/favicon.svg?v=3">
  <title>پنل کاربری | پیگیری اهدا</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 class="mb-3">پیگیری درخواست‌های اهدای کتاب</h4>
          <div class="table-responsive">
            <table class="table table-bordered table-striped">
              <thead>
                <tr>
                  <th>کد</th>
                  <th>عنوان</th>
                  <th>نویسنده</th>
                  <th>تاریخ</th>
                  <th>وضعیت</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    var user = requireLogin();
    renderUserSidebar("donate-track");

    var donations = getData("donations") || [];
    var html = "";
    for (var i = donations.length - 1; i >= 0; i--) {
      var d = donations[i];
      if (d.userId !== user.id) continue;
      html += "<tr>";
      html += "<td>" + d.id + "</td>";
      html += "<td>" + d.title + "</td>";
      html += "<td>" + d.author + "</td>";
      html += "<td>" + d.date + "</td>";
      html += '<td><span class="' + statusClass(d.status) + '">' + statusText(d.status) + "</span></td>";
      html += "</tr>";
    }
    document.getElementById("tableBody").innerHTML = html || '<tr><td colspan="5">درخواستی ثبت نشده است.</td></tr>';
  </script>
</body>
</html>
