<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/logo.jpg">
  <title>پنل کاربری | اهدای کتاب</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 class="mb-3">ثبت درخواست اهدای کتاب</h4>
          <form onsubmit="sendDonate(event)">
            <div class="mb-3">
              <label class="form-label">عنوان کتاب</label>
              <input type="text" id="title" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">نویسنده</label>
              <input type="text" id="author" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">دسته‌بندی پیشنهادی</label>
              <select id="categoryId" class="form-select"></select>
            </div>
            <div class="mb-3">
              <label class="form-label">توضیحات وضعیت کتاب</label>
              <textarea id="note" class="form-control" rows="3" placeholder="مثلا نو، کمی کارکرده و ..."></textarea>
            </div>
            <button type="submit" class="btn btn-main">ثبت درخواست اهدا</button>
          </form>
          <div id="msg" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    var user = requireLogin();
    renderUserSidebar("donate");

    var cats = getData("categories") || [];
    var sel = document.getElementById("categoryId");
    for (var i = 0; i < cats.length; i++) {
      var opt = document.createElement("option");
      opt.value = cats[i].id;
      opt.textContent = cats[i].name;
      sel.appendChild(opt);
    }

    function sendDonate(e) {
      e.preventDefault();
      var donations = getData("donations") || [];
      donations.push({
        id: getNextId("donation"),
        userId: user.id,
        title: document.getElementById("title").value.trim(),
        author: document.getElementById("author").value.trim(),
        categoryId: Number(document.getElementById("categoryId").value),
        note: document.getElementById("note").value.trim(),
        status: "pending",
        date: todayStr(),
        receivedDate: null
      });
      setData("donations", donations);

      document.getElementById("msg").innerHTML =
        '<div class="alert alert-success">درخواست اهدا ثبت شد. از صفحه پیگیری می‌توانید وضعیت را ببینید.</div>';
      document.getElementById("title").value = "";
      document.getElementById("author").value = "";
      document.getElementById("note").value = "";
    }
  </script>
</body>
</html>
