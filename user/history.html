<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/logo.jpg">
  <title>پنل کاربری | تاریخچه درخواست‌ها</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 class="mb-3">تاریخچه درخواست‌های امانت و اجاره</h4>
          <div class="table-responsive">
            <table class="table table-bordered table-striped">
              <thead>
                <tr>
                  <th>کد</th>
                  <th>کتاب</th>
                  <th>نوع</th>
                  <th>تاریخ درخواست</th>
                  <th>مهلت</th>
                  <th>وضعیت</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>

        <div class="panel-box">
          <h4 class="mb-3">جریمه‌های من</h4>
          <div class="table-responsive">
            <table class="table table-bordered">
              <thead>
                <tr>
                  <th>کتاب</th>
                  <th>مبلغ</th>
                  <th>توضیح</th>
                  <th>وضعیت</th>
                  <th>عملیات</th>
                </tr>
              </thead>
              <tbody id="fineBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    var user = requireLogin();
    renderUserSidebar("history");

    var requests = getData("requests") || [];
    var html = "";
    for (var i = requests.length - 1; i >= 0; i--) {
      var r = requests[i];
      if (r.userId !== user.id) continue;
      var b = getBookById(r.bookId);
      html += "<tr>";
      html += "<td>" + r.id + "</td>";
      html += "<td>" + (b ? b.title : "-") + "</td>";
      html += "<td>" + (r.type === "borrow" ? "امانت" : "اجاره") + "</td>";
      html += "<td>" + r.requestDate + "</td>";
      html += "<td>" + (r.dueDate || "-") + "</td>";
      html += '<td><span class="' + statusClass(r.status) + '">' + statusText(r.status) + "</span></td>";
      html += "</tr>";
    }
    document.getElementById("tableBody").innerHTML = html || '<tr><td colspan="6">درخواستی ثبت نشده است.</td></tr>';

    var fines = getData("fines") || [];
    var fhtml = "";
    for (var i = 0; i < fines.length; i++) {
      var f = fines[i];
      if (f.userId !== user.id) continue;
      var b = getBookById(f.bookId);
      fhtml += "<tr>";
      fhtml += "<td>" + (b ? b.title : "-") + "</td>";
      fhtml += "<td>" + formatPrice(f.amount) + "</td>";
      fhtml += "<td>" + (f.note || "-") + "</td>";
      fhtml += "<td>" + (f.paid ? "پرداخت شده" : "پرداخت نشده") + "</td>";
      if (!f.paid) {
        fhtml += '<td><a class="btn btn-sm btn-warning" href="../payment.html?type=fine&fineId=' + f.id + '">پرداخت</a></td>';
      } else {
        fhtml += "<td>-</td>";
      }
      fhtml += "</tr>";
    }
    document.getElementById("fineBody").innerHTML = fhtml || '<tr><td colspan="5">جریمه‌ای ندارید.</td></tr>';
  </script>
</body>
</html>
