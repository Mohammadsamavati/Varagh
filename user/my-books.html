<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/logo.jpg">
  <title>پنل کاربری | کتاب‌های من</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 class="mb-3">کتاب‌های خریداری شده</h4>
          <div class="table-responsive">
            <table class="table table-bordered table-striped">
              <thead>
                <tr>
                  <th>کتاب</th>
                  <th>مبلغ</th>
                  <th>تاریخ</th>
                  <th>وضعیت</th>
                </tr>
              </thead>
              <tbody id="ordersTable"></tbody>
            </table>
          </div>
        </div>

        <div class="panel-box">
          <h4 class="mb-3">کتاب‌های امانت / اجاره فعال</h4>
          <div class="table-responsive">
            <table class="table table-bordered table-striped">
              <thead>
                <tr>
                  <th>کتاب</th>
                  <th>نوع</th>
                  <th>وضعیت</th>
                  <th>مهلت بازگشت</th>
                </tr>
              </thead>
              <tbody id="activeTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    var user = requireLogin();
    renderUserSidebar("my-books");

    var orders = getData("orders") || [];
    var ot = document.getElementById("ordersTable");
    var ohtml = "";
    for (var i = 0; i < orders.length; i++) {
      if (orders[i].userId === user.id) {
        var b = getBookById(orders[i].bookId);
        ohtml += "<tr>";
        ohtml += "<td>" + (b ? b.title : "-") + "</td>";
        ohtml += "<td>" + formatPrice(orders[i].amount) + "</td>";
        ohtml += "<td>" + orders[i].date + "</td>";
        ohtml += '<td><span class="' + statusClass(orders[i].status) + '">' + statusText(orders[i].status) + "</span></td>";
        ohtml += "</tr>";
      }
    }
    ot.innerHTML = ohtml || '<tr><td colspan="4">هنوز خریدی ثبت نشده است.</td></tr>';

    var requests = getData("requests") || [];
    var at = document.getElementById("activeTable");
    var ahtml = "";
    for (var i = 0; i < requests.length; i++) {
      var r = requests[i];
      if (r.userId === user.id && (r.status === "approved" || r.status === "delivered" || r.status === "overdue")) {
        var b = getBookById(r.bookId);
        ahtml += "<tr>";
        ahtml += "<td>" + (b ? b.title : "-") + "</td>";
        ahtml += "<td>" + (r.type === "borrow" ? "امانت" : "اجاره") + "</td>";
        ahtml += '<td><span class="' + statusClass(r.status) + '">' + statusText(r.status) + "</span></td>";
        ahtml += "<td>" + (r.dueDate || "-") + "</td>";
        ahtml += "</tr>";
      }
    }
    at.innerHTML = ahtml || '<tr><td colspan="4">موردی وجود ندارد.</td></tr>';
  </script>
</body>
</html>
