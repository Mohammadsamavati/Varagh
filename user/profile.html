<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/favicon.svg?v=3">
  <title>پنل کاربری | ویرایش اطلاعات</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 class="mb-3">ویرایش اطلاعات شخصی</h4>
          <form onsubmit="saveProfile(event)">
            <div class="mb-3">
              <label class="form-label">نام</label>
              <input type="text" id="name" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">ایمیل</label>
              <input type="email" id="email" class="form-control" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">شماره تماس</label>
              <input type="text" id="phone" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">آدرس</label>
              <input type="text" id="address" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">رمز عبور جدید (اختیاری)</label>
              <input type="password" id="password" class="form-control" placeholder="اگر نمی‌خواهید عوض شود خالی بگذارید">
            </div>
            <button type="submit" class="btn btn-main">ذخیره تغییرات</button>
          </form>
          <div id="msg" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    var user = requireLogin();
    renderUserSidebar("profile");

    var full = getUserById(user.id);
    document.getElementById("name").value = full.name;
    document.getElementById("email").value = full.email;
    document.getElementById("phone").value = full.phone || "";
    document.getElementById("address").value = full.address || "";

    function saveProfile(e) {
      e.preventDefault();
      var users = getData("users") || [];
      for (var i = 0; i < users.length; i++) {
        if (users[i].id === user.id) {
          users[i].name = document.getElementById("name").value.trim();
          users[i].phone = document.getElementById("phone").value.trim();
          users[i].address = document.getElementById("address").value.trim();
          var pass = document.getElementById("password").value;
          if (pass) {
            users[i].password = pass;
          }
          setCurrentUser(users[i]);
        }
      }
      setData("users", users);
      document.getElementById("msg").innerHTML = '<div class="alert alert-success">اطلاعات ذخیره شد.</div>';
      renderNavbar();
    }
  </script>
</body>
</html>
