<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/logo.jpg">
  <title>پنل کاربری | درخواست اجاره</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 class="mb-3">ثبت درخواست اجاره کتاب</h4>
          <form onsubmit="sendRent(event)">
            <div class="mb-3">
              <label class="form-label">انتخاب کتاب</label>
              <select id="bookId" class="form-select" required onchange="showRentPrice()"></select>
            </div>
            <div class="mb-3">
              <label class="form-label">مدت پیشنهادی (روز)</label>
              <input type="number" id="days" class="form-control" min="1" max="60" value="7" required>
            </div>
            <div class="mb-3">
              <label class="form-label">توضیحات</label>
              <textarea id="note" class="form-control" rows="3"></textarea>
            </div>
            <p id="rentInfo" class="text-muted"></p>
            <button type="submit" class="btn btn-main">ارسال درخواست</button>
          </form>
          <div id="msg" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    var user = requireLogin();
    renderUserSidebar("rent");

    var books = getData("books") || [];
    var select = document.getElementById("bookId");
    select.innerHTML = '<option value="">انتخاب کنید</option>';
    for (var i = 0; i < books.length; i++) {
      if (books[i].forRent && books[i].stock > 0) {
        var opt = document.createElement("option");
        opt.value = books[i].id;
        opt.textContent = books[i].title + " (" + formatPrice(books[i].rentPrice) + ")";
        select.appendChild(opt);
      }
    }

    var pre = getQueryParam("bookId");
    if (pre) {
      select.value = pre;
      showRentPrice();
    }

    function showRentPrice() {
      var book = getBookById(document.getElementById("bookId").value);
      var days = Number(document.getElementById("days").value) || 1;
      if (book) {
        document.getElementById("rentInfo").textContent =
          "مبلغ تقریبی اجاره: " + formatPrice(book.rentPrice * days) + " (قابل تایید توسط مدیر)";
      } else {
        document.getElementById("rentInfo").textContent = "";
      }
    }

    document.getElementById("days").addEventListener("input", showRentPrice);

    function sendRent(e) {
      e.preventDefault();
      var bookId = Number(document.getElementById("bookId").value);
      var days = Number(document.getElementById("days").value);
      var book = getBookById(bookId);

      if (!book) {
        alert("کتاب را انتخاب کنید");
        return;
      }

      var requests = getData("requests") || [];
      requests.push({
        id: getNextId("request"),
        userId: user.id,
        bookId: bookId,
        type: "rent",
        status: "pending",
        note: document.getElementById("note").value.trim(),
        days: days,
        amount: book.rentPrice * days,
        requestDate: todayStr(),
        dueDate: null,
        deliverDate: null,
        returnDate: null
      });
      setData("requests", requests);

      document.getElementById("msg").innerHTML =
        '<div class="alert alert-success">درخواست اجاره ثبت شد.</div>';
    }
  </script>
</body>
</html>
