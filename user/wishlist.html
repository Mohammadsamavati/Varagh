<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="../images/favicon.svg?v=3">
  <title>پنل کاربری | علاقه‌مندی‌ها</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container my-4">
    <div class="row">
      <div class="col-md-3 mb-3" id="sidebar"></div>
      <div class="col-md-9">
        <div class="panel-box">
          <h4 class="mb-3">لیست علاقه‌مندی‌ها</h4>
          <div class="table-responsive">
            <table class="table table-bordered">
              <thead>
                <tr>
                  <th>کتاب</th>
                  <th>نویسنده</th>
                  <th>قیمت</th>
                  <th>عملیات</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/common.js"></script>
  <script>
    var user = requireLogin();
    renderUserSidebar("wishlist");
    showList();

    function showList() {
      var list = getData("wishlist") || [];
      var html = "";
      for (var i = 0; i < list.length; i++) {
        if (list[i].userId !== user.id) continue;
        var b = getBookById(list[i].bookId);
        if (!b) continue;
        html += "<tr>";
        html += "<td>" + b.title + "</td>";
        html += "<td>" + b.author + "</td>";
        html += "<td>" + formatPrice(b.price) + "</td>";
        html += "<td>";
        html += '<a class="btn btn-sm btn-main me-1" href="../book-detail.html?id=' + b.id + '">مشاهده</a>';
        html += '<button class="btn btn-sm btn-danger" onclick="removeItem(' + b.id + ')">حذف</button>';
        html += "</td></tr>";
      }
      document.getElementById("tableBody").innerHTML = html || '<tr><td colspan="4">لیست خالی است.</td></tr>';
    }

    function removeItem(bookId) {
      var list = getData("wishlist") || [];
      var newList = [];
      for (var i = 0; i < list.length; i++) {
        if (!(list[i].userId === user.id && list[i].bookId == bookId)) {
          newList.push(list[i]);
        }
      }
      setData("wishlist", newList);
      showList();
    }
  </script>
</body>
</html>
